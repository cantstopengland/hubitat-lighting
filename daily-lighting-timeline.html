<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lighting Timeline</title>
<style>
:root{--bg:#fbfaf7;--panel:#ffffff;--soft:#f1efe8;--tx:#1f1e1b;--tx2:#5f5e5a;--tx3:#8a8882;--bd:#e2e0d8;--bd2:#c9c6bb;--acc:#185fa5;--acc-bg:#e6f1fb;--warn:#a35b00;--warn-bg:#faeeda;--dan:#a32d2d;--night:rgba(24,95,165,.18);--day:rgba(250,199,117,.35);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--panel:#252523;--soft:#2e2e2b;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#888780;--bd:#3a3a37;--bd2:#55554f;--acc:#85b7eb;--acc-bg:#0c2c4c;--warn:#efa94a;--warn-bg:#3d2a0d;--dan:#f09595;--night:rgba(55,138,221,.22);--day:rgba(239,159,39,.18);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--bd2);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--soft)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--panel)}
button.danger{color:var(--dan)}
button.link{border:none;background:none;padding:0;color:var(--acc);text-decoration:underline}
select,input[type=text],input[type=time],input[type=number]{background:var(--panel);border:1px solid var(--bd2);border-radius:6px;padding:4px 6px}
input[type=number]{width:64px}
input[type=range]{accent-color:#ef9f27}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:17px;font-weight:600;margin:0}
#status{color:var(--tx2);font-size:13px}
#status.err{color:var(--dan)}
header .sp{flex:1}
#banner{display:none;margin:8px 16px 0;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
#banner.on{display:flex;gap:12px;align-items:center}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--tx2);font-size:12px;padding:8px 16px 0}
.legend .bar{width:140px;height:10px;border-radius:3px;border:1px solid var(--bd)}
#sched{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px 0}
#sched .tab{border-radius:999px;padding:3px 12px}
#sched .tab .d{color:var(--tx3);font-size:12px;margin-left:6px}
#sched .tab.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
#sched .tab.on .d{color:var(--acc);font-weight:400}
#sched .td{font-size:10px;margin-left:6px;padding:0 5px;border-radius:4px;background:var(--acc);color:var(--panel);font-weight:600;letter-spacing:.03em;vertical-align:1px}
#sched .warn{color:var(--warn);font-size:12px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;border:1px solid var(--bd2);border-radius:6px;padding:4px 6px;min-width:44px;cursor:pointer}
.days label.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.days label .o{font-size:10px;color:var(--tx3);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.days input{position:absolute;opacity:0;pointer-events:none}
#strip{position:relative;height:30px;margin:8px 16px 4px}
#strip .track{position:absolute;left:0;right:0;top:0;height:14px;border-radius:4px;background:var(--day);overflow:hidden}
#strip .night{position:absolute;top:0;bottom:0;background:var(--night)}
#strip .dot{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--tx2);cursor:pointer;border:none;padding:0}
#strip .dot.sel{background:var(--acc);transform:scale(1.4)}
#strip .now{position:absolute;top:-2px;height:18px;width:2px;background:var(--dan)}
#strip .tick{position:absolute;top:16px;font-size:11px;color:var(--tx3);transform:translateX(-50%)}
#wrap{flex:1;min-height:0;overflow:auto;margin:4px 16px 16px;border:1px solid var(--bd);border-radius:8px;background:var(--panel)}
body.ed-open #wrap{margin-right:412px}
body.ed-open #strip,body.ed-open .legend,body.ed-open #sched{margin-right:412px}
#m{--nw:236px;--cw:64px;border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed;width:100%;min-width:calc(var(--nw) + var(--n,1) * var(--cw))}
#m col.cn{width:var(--nw)}
#m th,#m td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);height:28px;padding:0 2px;text-align:center;white-space:nowrap;overflow:hidden}
#m thead th{position:sticky;top:0;z-index:2;background:var(--panel);height:auto;padding:4px 2px;font-weight:400;vertical-align:bottom}
#m .n{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;padding:0 6px}
#m thead th.n{z-index:3;vertical-align:middle}
#m th.sh{cursor:ew-resize;user-select:none;touch-action:none}
#m th.sh:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
#m th.sh .tm{font-weight:600;color:var(--tx)}
#m th.sh .lb{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;font-size:11px}
#m th.sh .tg{color:var(--tx3);font-size:10px}
#m th.sh.cur{background:var(--acc-bg)}
#m th.sh.cur .tg{color:var(--acc)}
#m th.sh.warn .tm::after{content:" !";color:var(--warn)}
#m .sel{box-shadow:inset 0 0 0 2px var(--acc)}
#m td.c{cursor:pointer;position:relative}
#m td.pon::before,#m td.poff::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
#m td.pon::before{background:#639922}
#m td.poff::before{background:#5f5e5a}
@media (prefers-color-scheme:dark){#m td.pon::before{background:#97c459}#m td.poff::before{background:#b4b2a9}}
.mk{display:inline-block;width:14px;height:12px;vertical-align:-2px;margin-right:3px;border:1px solid var(--bd)}
#m td.e:hover{background:var(--soft)}
#m td.hz{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 4px,transparent 4px,transparent 8px);color:var(--tx2)}
#m tr.room td{background:var(--soft);font-weight:600;cursor:pointer;height:26px}
#m tr.room td.n{background:var(--soft)}
#m tr.room .cnt{font-weight:400;color:var(--tx3);margin-left:6px}
.nrow{display:flex;align-items:center;gap:6px}
.nrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;min-width:40px;text-align:center;border-radius:4px;font-size:11px;line-height:18px;border:1px solid var(--bd);flex:none}
.chip.off{color:var(--tx3)}
.pend{color:var(--warn);font-size:11px}
.plus{flex:none;width:22px;height:20px;padding:0;line-height:1;font-size:14px;color:var(--tx2);opacity:.55}
tr:hover .plus{opacity:1}
.ic{width:11px;height:11px;vertical-align:-1px;margin-right:1px}
.ctx{display:inline-flex;gap:6px}
aside#ed{position:fixed;top:0;right:0;bottom:0;width:396px;overflow:auto;background:var(--panel);border-left:1px solid var(--bd);padding:14px 16px 24px;transform:translateX(105%);transition:transform .15s;z-index:10}
body.ed-open aside#ed{transform:none}
#ed h2{font-size:16px;margin:0;flex:1}
#ed .hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
#ed .sub{color:var(--tx2);margin:0 0 10px}
#ed .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
#ed label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tx2)}
#ed h3{font-size:13px;margin:16px 0 6px;color:var(--tx2);font-weight:600}
#ed .note{font-size:12px;color:var(--tx2)}
#ed .warnbox{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12px;margin:8px 0}
.rl{width:100%;border-collapse:collapse}
.rl td{padding:5px 2px;border-bottom:1px solid var(--bd);vertical-align:middle}
.rl .rn{font-size:11px;color:var(--tx3)}
.rl select{max-width:118px;font-size:12px;padding:2px 4px}
.rl input[type=number]{width:52px;font-size:12px;padding:2px 4px}
.sw{display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:-3px;border:1px solid var(--bd)}
.cl .g{margin:6px 0}
.cl .g>label{font-weight:600}
.cl .g div label{display:block;padding:1px 0 1px 18px;font-size:13px}
.day{list-style:none;padding:0;margin:0}
.day li{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--bd);font-size:13px;cursor:pointer}
.day li.here{font-weight:600}
.day .t{width:64px;color:var(--tx2)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){
  body.ed-open #strip,body.ed-open .legend,body.ed-open #sched{margin-right:16px}
  aside#ed{top:auto;left:0;width:auto;height:60vh;border-left:none;border-top:1px solid var(--bd);transform:translateY(105%);border-radius:12px 12px 0 0}
  #wrap{flex:none;height:calc(100vh - 190px);min-height:260px}
  body.ed-open #wrap{margin-right:16px;height:calc(40vh - 24px);min-height:160px}
  body.ed-open .legend,body.ed-open #strip,#legendIcons{display:none}
  header{gap:8px}
  #m{--nw:160px}
  header h1{font-size:15px}
}
</style>
</head>
<body>
<header>
  <h1>Lighting timeline</h1>
  <span id="status">Loading…</span>
  <span class="sp"></span>
  <button id="undoBtn" disabled title="Undo (Ctrl+Z)">Undo</button>
  <button id="reloadBtn" title="Reload from the hub">Reload</button>
  <a id="exportLink" target="_blank" rel="noopener" style="font-size:13px;color:var(--acc)">Export JSON</a>
</header>
<div id="banner"></div>
<div id="sched"></div>
<div class="legend">
  <span>Level</span><span>1%</span><span class="bar" id="bar"></span><span>100%</span>
  <span id="legendIcons"></span>
</div>
<div id="strip"></div>
<div id="wrap"><table id="m"></table></div>
<aside id="ed" aria-label="Editor"></aside>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// ---------- basics ----------
const Q = new URLSearchParams(location.search);
const TOKEN = Q.get('access_token') || '';
const MOCK = Q.get('mock');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hm = s => { const [a, b] = String(s).split(':'); return (+a) * 60 + (+b); };
const toHM = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const wrap = m => ((m % 1440) + 1440) % 1440;
const fmt = m => { m = wrap(m); const h = Math.floor(m / 60); return (h % 12 || 12) + ':' + pad(m % 60) + (h < 12 ? ' AM' : ' PM'); };
const fmtS = m => { m = wrap(m); const h = Math.floor(m / 60); return (h % 12 || 12) + ':' + pad(m % 60) + (h < 12 ? 'a' : 'p'); };
const clampL = v => Math.max(1, Math.min(100, Math.round(+v || 1)));
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const PW = [['', 'Leave as is'], ['on', 'Turn on'], ['off', 'Turn off']];
const LV = [['', 'No level change'], ['set', 'Set to'], ['atLeast', 'Raise to at least'], ['atMost', 'Dim to at most']];
const SYM = {set: '', atLeast: '≥', atMost: '≤'};
const BON = '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2a4.6 4.6 0 0 0-2.7 8.3c.5.4.7.8.7 1.3V12h4v-1.2c0-.5.2-.9.7-1.3A4.6 4.6 0 0 0 8 1.2z" fill="currentColor"/><rect x="6" y="12.8" width="4" height="1.8" rx=".7" fill="currentColor"/></svg>';
const BOFF = '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.7a4.1 4.1 0 0 0-2.4 7.4c.5.4.9.9.9 1.6v.8h3v-.8c0-.7.4-1.2.9-1.6A4.1 4.1 0 0 0 8 1.7z" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6" y="12.8" width="4" height="1.8" rx=".7" fill="currentColor"/><path d="M2 2l12 12" stroke="currentColor" stroke-width="1.4"/></svg>';

// Level color ramp: brown (dim) -> orange -> yellow -> warm white (bright)
const RAMP = [[1, [74, 27, 12]], [10, [113, 43, 19]], [25, [216, 90, 48]], [45, [239, 159, 39]], [70, [250, 199, 117]], [100, [255, 251, 240]]];
function col(l, alpha) {
  l = Math.max(1, Math.min(100, l));
  let c = [255, 251, 240];
  for (let i = 1; i < RAMP.length; i++) if (l <= RAMP[i][0]) {
    const [a, ca] = RAMP[i - 1], [b, cb] = RAMP[i], f = (l - a) / (b - a);
    c = ca.map((x, j) => Math.round(x + (cb[j] - x) * f));
    break;
  }
  return alpha ? 'rgba(' + c.join(',') + ',' + alpha + ')' : 'rgb(' + c.join(',') + ')';
}
const ink = l => l >= 40 ? '#412402' : '#faeeda';

// ---------- state ----------
let TL = null;              // {version, schedules:[{id,name,days:[1-7],slots:[{id,label,timing,time,offset,rules:{devId:{power,level,value}}}]}]}
let LIGHTS = [];            // [{id,name,room,sw,level,staged,canPrestage,pending}]
let SUN = {sr: 390, ss: 1020};
let clockOff = 0, lastFired = null;
let DS = 240, TODAY = null;  // the schedule day starts at 4 AM; TODAY = id of the schedule in charge today
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const ui = {ed: null, menu: false, drag: null, closed: loadClosed(), sched: null};
// The schedule being viewed and edited.
const C = () => TL.schedules.find(x => x.id === ui.sched) || TL.schedules[0];
let undoStack = [], undoKey = null;
let saving = false, dirty = false, saveTimer = null, conflict = false;

function loadClosed() {
  try { const v = JSON.parse(localStorage.getItem('dlt.closed') || 'null'); if (Array.isArray(v)) return new Set(v); } catch (e) {}
  return new Set(['Unassigned']);
}
function storeClosed() { try { localStorage.setItem('dlt.closed', JSON.stringify([...ui.closed])); } catch (e) {} }

// ---------- API ----------
let mockData = null;
async function mockApi(path, opt) {
  if (!mockData) mockData = await (await fetch(MOCK)).json();
  await new Promise(r => setTimeout(r, 150));
  if (path === 'timeline' && opt && opt.method === 'POST') {
    const b = JSON.parse(opt.body);
    if (b.baseVersion !== mockData.timeline.version) { const e = new Error('conflict'); e.status = 409; throw e; }
    mockData.timeline = JSON.parse(JSON.stringify(b.timeline));
    mockData.timeline.version = b.baseVersion + 1;
    return {ok: true, version: mockData.timeline.version};
  }
  if (path.startsWith('test/')) return {ok: true};
  return JSON.parse(JSON.stringify(mockData));
}
async function api(path, opt) {
  if (MOCK) return mockApi(path, opt);
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + 'access_token=' + encodeURIComponent(TOKEN), opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}

function applyPayload(d, full) {
  LIGHTS = (d.lights || []).map(l => ({...l, id: String(l.id)}));
  const n = new Date();
  if (d.nowHM) clockOff = hm(d.nowHM) - (n.getHours() * 60 + n.getMinutes());
  lastFired = d.lastFired || null;
  if (full) {
    TL = d.timeline || {version: 0, schedules: []};
    if (!TL.schedules) TL = {version: TL.version || 0, schedules: [{id: 'd1', name: 'Every day', days: [1, 2, 3, 4, 5, 6, 7], slots: TL.slots || []}]};
    if (!TL.schedules.length) TL.schedules.push({id: 'd1', name: 'Every day', days: [1, 2, 3, 4, 5, 6, 7], slots: []});
    TL.schedules.forEach(sc => { sc.days = sc.days || []; sc.slots = sc.slots || []; sc.slots.forEach(s => { s.rules = s.rules || {}; }); });
    if (d.dayStart != null) DS = d.dayStart;
    TODAY = d.todaySchedule || null;
    if (!TL.schedules.some(x => x.id === ui.sched)) ui.sched = TODAY && TL.schedules.some(x => x.id === TODAY) ? TODAY : TL.schedules[0].id;
    if (d.sun) SUN = {sr: d.sun.sunrise ? hm(d.sun.sunrise) : 390, ss: d.sun.sunset ? hm(d.sun.sunset) : 1020};
    if (d.hubName) document.title = 'Lighting Timeline · ' + d.hubName;
  }
}
const nowMin = () => { const n = new Date(); return wrap(n.getHours() * 60 + n.getMinutes() + clockOff); };

async function load() {
  setStatus('Loading…');
  try {
    applyPayload(await api('timeline'), true);
    conflict = false; dirty = false; undoStack = []; updUndo();
    $('banner').className = '';
    setStatus('Up to date');
    render(); renderEditor();
  } catch (e) {
    setStatus("Couldn't load: " + e.message, true);
  }
}
async function poll() {
  if (ui.drag || document.hidden) return;
  try { applyPayload(await api('state'), false); if (!ui.drag) { render(); refreshEditorLive(); } } catch (e) { /* keep last values */ }
}

// ---------- saving & undo ----------
function setStatus(t, err) { const s = $('status'); s.textContent = t; s.className = err ? 'err' : ''; }
function pushUndo(key) {
  if (key && key === undoKey) return;
  undoKey = key || null;
  undoStack.push(JSON.stringify({schedules: TL.schedules, sched: ui.sched}));
  if (undoStack.length > 80) undoStack.shift();
  updUndo();
}
function updUndo() { $('undoBtn').disabled = !undoStack.length; }
function undo() {
  if (!undoStack.length) return;
  const u = JSON.parse(undoStack.pop());
  TL.schedules = u.schedules; ui.sched = u.sched;
  if (ui.ed && ui.ed.type === 'sched' && !TL.schedules.some(x => x.id === ui.ed.scid)) closeEditor();
  undoKey = null; updUndo();
  if (ui.ed) delete ui.ed.draft;
  if (ui.ed && ui.ed.sid && !slotById(ui.ed.sid)) closeEditor();
  render(); renderEditor(); scheduleSave();
  toast('Undone');
}
// Wraps every edit: records undo, applies, re-renders, saves.
function edit(fn, opts = {}) {
  pushUndo(opts.key);
  fn();
  render();
  if (!opts.keepEditor) redrawEditor();
  scheduleSave();
}
function scheduleSave(delay = 700) {
  if (conflict) return;
  dirty = true; setStatus('Unsaved changes…');
  clearTimeout(saveTimer); saveTimer = setTimeout(save, delay);
}
async function save() {
  if (conflict || !dirty) return;
  if (saving) { scheduleSave(); return; }
  saving = true; dirty = false; setStatus('Saving…');
  let retry = 0;
  try {
    const r = await api('timeline', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({baseVersion: TL.version, timeline: TL})});
    TL.version = r.version;
    if (!dirty) setStatus('Saved ' + new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}));
  } catch (e) {
    if (e.status === 409) {
      conflict = true;
      setStatus('Not saved', true);
      const b = $('banner');
      b.innerHTML = '<span>The timeline was changed somewhere else since this page loaded, so this edit wasn\'t saved.</span><button id="bReload">Reload latest</button>';
      b.className = 'on';
      $('bReload').onclick = load;
    } else {
      dirty = true; retry = 5000;
      setStatus("Couldn't save (" + e.message + "). Retrying…", true);
    }
  } finally {
    saving = false;
    if (dirty && !conflict) { clearTimeout(saveTimer); saveTimer = setTimeout(save, retry || 700); }
  }
}
async function flush() { clearTimeout(saveTimer); while (saving) await new Promise(r => setTimeout(r, 100)); if (dirty) await save(); }
window.addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });

// ---------- model helpers ----------
const slotById = id => C().slots.find(s => s.id === id);
const lightById = id => LIGHTS.find(l => l.id === String(id));
const T = s => s.timing === 'fixed' ? hm(s.time) : (s.timing === 'sunrise' ? SUN.sr : SUN.ss) + (+s.offset || 0);
// Minutes since the schedule day started (4 AM), so late-night timeslots sort last.
const ord = m => wrap(m - DS);
const sorted = () => [...C().slots].sort((a, b) => ord(T(a)) - ord(T(b)) || String(a.label).localeCompare(String(b.label)));
function setT(s, m) {
  if (s.timing === 'fixed') s.time = toHM(Math.max(0, Math.min(1439, m)));
  else s.offset = Math.max(-720, Math.min(720, m - (s.timing === 'sunrise' ? SUN.sr : SUN.ss)));
}
const tag = s => s.timing === 'fixed' ? '' : (s.timing === 'sunrise' ? 'sunrise ' : 'sunset ') + (s.offset >= 0 ? '+' : '−') + Math.abs(s.offset) + 'm';
const tagShort = s => s.timing === 'fixed' ? ' ' : (s.timing === 'sunrise' ? '☀↑' : '☀↓') + (s.offset >= 0 ? '+' : '−') + Math.abs(s.offset);
function rooms() {
  const m = new Map();
  LIGHTS.forEach(l => { const r = l.room || 'Unassigned'; if (!m.has(r)) m.set(r, []); m.get(r).push(l); });

/**
 * Cells for one light's row. If any of the light's rules turn it on or off,
 * the row also shows the state those rules imply between timeslots: starting
 * from the last power/level rule of the previous day, "on" carries a faded
 * level color and "off" carries hatching. Level rules while the light is
 * expected off only pre-stage, so they're hatched too. Lights with no power
 * rules are left unshaded: their state depends on people, not the timeline.

function rowCells(l, ss, sel) {
  const rules = ss.map(s => s.rules[l.id]);
  const hasPower = rules.some(r => r && r.power);
  let st = null, lv = null;
  if (hasPower) rules.forEach(r => { if (r && r.power) st = r.power; if (r && r.level) lv = r.value; });
  let h = '';
  ss.forEach((s, i) => {
    const r = rules[i], selc = sel.type === 'cell' && sel.sid === s.id && sel.lid === l.id ? ' sel' : '';
    const d = ' data-s="' + s.id + '" data-l="' + l.id + '"';
    if (r && r.level) lv = r.value;
    if (r && r.power) st = r.power;
    if (!r) {
      if (st === 'on') h += '<td class="c e' + selc + '"' + d + ' title="Expected on' + (lv ? ' at about ' + lv + '%' : '') + ' (from the rules)" style="background:' + (lv ? col(lv, .38) : 'var(--acc-bg)') + '"></td>';
      else if (st === 'off') h += '<td class="c e hz' + selc + '"' + d + ' title="Expected off (from the rules)"></td>';
      else h += '<td class="c e' + selc + '"' + d + '></td>';
      return;
    }
    const pc = r.power === 'on' ? ' pon' : r.power === 'off' ? ' poff' : '';
    let title = ruleText(r);
    if (r.power === 'off' || !r.level || (st === 'off' && !r.power)) {
      if (st === 'off' && !r.power) title += ' (expected off, so this only pre-stages)';
      const bg = r.power === 'on' && lv ? ' style="background:' + col(lv, .38) + '"' : '';
      h += '<td class="c' + (r.power === 'on' ? '' : ' hz') + pc + selc + '"' + d + ' title="' + esc(title) + '"' + bg + '>' + ruleHTML(r) + '</td>';
    } else {
      h += '<td class="c' + pc + selc + '"' + d + ' title="' + esc(title) + '" style="background:' + col(r.value) + ';color:' + ink(r.value) + '">' + ruleHTML(r) + '</td>';
    }
  });
  return h;
}

/**
 * Redraws the editor after an edit without losing keyboard focus. A change

let redrawPending = false;
function redrawEditor() {
  if (redrawPending) return;

  setTimeout(() => {
    redrawPending = false;
    const root = $('ed'), k = focusKey(document.activeElement), top = root.scrollTop;
    renderEditor();
    root.scrollTop = top;

  }, 0);
}
// Identifies a control in the editor by its data-* attributes (and its light row), so it can be found again after a redraw.
function focusKey(el) {

function renderEditor() {

  if (e.type === 'new') return renderNewEditor(root, e);

function renderSlotEditor(root, e) {

  let rows = '';
  rooms().forEach(([rn, ls]) => ls.forEach(l => {
    const r = s.rules[l.id]; if (!r) return;

    + '<div class="row"><label class="f" style="flex:1">Label<input type="text" data-f2="label" maxlength="60" value="' + esc(s.label) + '"></label></div>'
    + timingHTML(s)
    + (same.length ? '<div class="warnbox">Also firing at ' + fmt(T(s)) + ': ' + same.map(o => '<b>' + esc(o.label || 'Untitled') + '</b> <button class="link" data-merge="' + o.id + '">merge it into this one</button>').join(', ') + '</div>' : '')

    + '<p class="note">Test now runs the rules immediately on the real lights, including turning lights on or off.</p>';

  root.querySelectorAll('tr[data-l]').forEach(tr => {
    const lid = tr.dataset.l, r = s.rules[lid];
    tr.querySelector('[data-r="power"]').addEventListener('change', ev => mut(() => { r.power = ev.target.value; normalize(s, lid); }));
    tr.querySelector('[data-r="level"]').addEventListener('change', ev => mut(() => { r.level = ev.target.value; r.value = r.level ? (r.value || defaultLevel(lid)) : null; normalize(s, lid); }));
    const v = tr.querySelector('[data-r="value"]');
    // Level numbers update in place (no redraw), so typing and tabbing down the column never races a re-render.
    if (v) v.addEventListener('change', () => {
      edit(() => r.value = clampL(v.value), {keepEditor: true});
      v.value = r.value;
      const sw = tr.querySelector('.sw'); if (sw) sw.style.background = col(r.value);
    });
  });
  root.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => mut(() => delete s.rules[b.dataset.rm])));
  // Tab moves down a column: every Power first, then every Level rule, then every level number.
  const order = ['power', 'level', 'value'].flatMap(k => [...root.querySelectorAll('.rl [data-r="' + k + '"]')]);
  const rl = root.querySelector('.rl');
  if (rl) rl.addEventListener('keydown', ev => {
    if (ev.key !== 'Tab' || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const j = order.indexOf(ev.target) + (ev.shiftKey ? -1 : 1);
    if (order.indexOf(ev.target) < 0 || j < 0 || j >= order.length) return;
    ev.preventDefault();
    order[j].focus();
  });
  root.querySelector('[data-add]').addEventListener('change', ev => {
    const v = ev.target.value; if (!v) return;
    const ids = v.startsWith('room:') ? (rooms().find(r => r[0] === v.slice(5)) || [null, []])[1].map(l => l.id) : [v];
    mut(() => ids.forEach(id => { if (!s.rules[id]) s.rules[id] = {power: '', level: 'set', value: defaultLevel(id)}; }));
  });
  root.querySelectorAll('[data-merge]').forEach(b => b.addEventListener('click', () => mut(() => {
    const o = slotById(b.dataset.merge);
    Object.entries(o.rules).forEach(([k, r]) => { if (!s.rules[k]) s.rules[k] = r; });
    if (o.label && !String(s.label).split(' / ').includes(o.label)) s.label = s.label ? s.label + ' / ' + o.label : o.label;
    C().slots = C().slots.filter(x => x.id !== o.id);
  })));
  bindCommon(root, s);
}

function bindCommon(root, s) {
  root.querySelector('[data-x="close"]').addEventListener('click', closeEditor);
  const t = root.querySelector('[data-x="test"]');
  if (t) t.addEventListener('click', async () => {
    try { await flush(); await api('test/' + encodeURIComponent(s.id), {method: 'POST'}); toast('Ran “' + (s.label || 'timeslot') + '”'); setTimeout(poll, 2500); }
    catch (err) { toast("Couldn't run it: " + err.message); }
  });
  const d = root.querySelector('[data-x="dup"]');
  if (d) d.addEventListener('click', () => {
    const n = JSON.parse(JSON.stringify(s)); n.id = uid(); n.label = (s.label || 'Timeslot') + ' (copy)'; setT(n, T(s) + 30);
    edit(() => C().slots.push(n)); openEditor({type: 'slot', sid: n.id});
  });
  const del = root.querySelector('[data-x="del"]');
  if (del) del.addEventListener('click', () => {
    if (!confirm('Delete “' + (s.label || 'this timeslot') + '” at ' + fmt(T(s)) + '? You can undo this.')) return;
    edit(() => C().slots = C().slots.filter(x => x.id !== s.id)); closeEditor();
  });
}

// A rule with neither power nor level does nothing, so it's removed.
function normalize(s, lid) { const r = s.rules[lid]; if (r && !r.power && !r.level) delete s.rules[lid]; }
function defaultLevel(lid) { const l = lightById(lid); return l && l.sw === 'on' && l.level ? clampL(l.level) : 50; }

function renderCellEditor(root, e) {
  const s = slotById(e.sid), l = lightById(e.lid);
  if (!s || !l) return closeEditor();
  const r = s.rules[l.id];
  const draft = e.draft || (r ? {...r} : {power: '', level: 'set', value: defaultLevel(l.id)});
  e.draft = draft;
  const day = sorted().map(o => {
    const rr = o.rules[l.id]; if (!rr) return '';
    return '<li data-go="' + o.id + '" class="' + (o.id === s.id ? 'here' : '') + '"><span class="t">' + fmtS(T(o)) + '</span><span style="flex:1">' + esc(o.label || 'Untitled') + '</span><span>' + (rr.level ? '<span class="sw" style="background:' + col(rr.value) + '"></span> ' : '') + esc(ruleText(rr)) + '</span></li>';
  }).join('');
  let cl = '';
  rooms().forEach(([rn, ls]) => {
    const o = ls.filter(x => x.id !== l.id); if (!o.length) return;
    cl += '<div class="g"><label><input type="checkbox" data-room="' + esc(rn) + '"> ' + esc(rn) + '</label><div>' + o.map(x => '<label><input type="checkbox" value="' + x.id + '" data-in="' + esc(rn) + '"> ' + esc(shortName(x)) + (s.rules[x.id] ? ' <span class="note">(' + esc(ruleText(s.rules[x.id])) + ')</span>' : '') + '</label>').join('') + '</div></div>';
  });
  root.innerHTML = head(esc(l.name), esc(l.room) + ' · ' + esc(fmt(T(s)) + ' ' + (s.label || '')))
    + '<div class="row note">Right now: ' + chip(l) + ' ' + esc(liveText(l)) + '</div>'
    + (r ? '' : '<div class="warnbox">This light isn\'t in this timeslot yet.</div>')
    + '<div class="row"><label class="f">Power<select data-d="power">' + opt(PW, draft.power) + '</select></label><label class="f">Level<select data-d="level">' + opt(LV, draft.level) + '</select></label></div>'
    + (draft.level ? '<div class="row"><input type="range" min="1" max="100" step="1" data-d="range" value="' + draft.value + '" style="flex:1"><input type="number" min="1" max="100" data-d="value" value="' + draft.value + '" aria-label="Level percent"><span class="sw" data-sw style="background:' + col(draft.value) + '"></span></div>' : '')
    + (!draft.power && !draft.level ? '<p class="note">With no power or level change this rule does nothing.</p>' : '')
    + '<div class="row">' + (r ? '<button class="danger" data-x="rm">Remove from timeslot</button>' : '<button class="primary" data-x="add">Add to this timeslot</button>') + '<button data-x="slot">Edit whole timeslot</button></div>'
    + '<h3>This light\'s day</h3>' + (day ? '<ul class="day">' + day + '</ul>' : '<p class="note">Not in any timeslot yet.</p>')
    + '<h3>Copy this rule to other lights at ' + fmtS(T(s)) + '</h3><div class="cl">' + cl + '</div><div class="row"><button data-x="copy">Copy to selected</button></div>';
  const commit = (key, keep) => { if (s.rules[l.id]) edit(() => { s.rules[l.id] = {...draft}; normalize(s, l.id); }, {key, keepEditor: keep}); };
  root.querySelector('[data-d="power"]').addEventListener('change', ev => { draft.power = ev.target.value; commit(); redrawEditor(); });
  root.querySelector('[data-d="level"]').addEventListener('change', ev => { draft.level = ev.target.value; if (draft.level && !draft.value) draft.value = defaultLevel(l.id); if (!draft.level) draft.value = null; commit(); redrawEditor(); });
  const rg = root.querySelector('[data-d="range"]'), nb = root.querySelector('[data-d="value"]'), sw = root.querySelector('[data-sw]');
  const setV = (v, from) => { draft.value = clampL(v); if (from !== rg && rg) rg.value = draft.value; if (from !== nb && nb) nb.value = draft.value; if (sw) sw.style.background = col(draft.value); };
  if (rg) rg.addEventListener('input', () => { setV(rg.value, rg); commit('range:' + s.id + ':' + l.id, true); });
  if (nb) nb.addEventListener('change', () => { setV(nb.value, nb); commit('range:' + s.id + ':' + l.id, true); });
  const rm = root.querySelector('[data-x="rm"]');
  if (rm) rm.addEventListener('click', () => { edit(() => delete s.rules[l.id]); });
  const ad = root.querySelector('[data-x="add"]');
  if (ad) ad.addEventListener('click', () => { if (!draft.power && !draft.level) return toast('Choose a power or level change first'); edit(() => s.rules[l.id] = {...draft}); });
  root.querySelector('[data-x="slot"]').addEventListener('click', () => openEditor({type: 'slot', sid: s.id}));
  root.querySelectorAll('[data-room]').forEach(cb => cb.addEventListener('change', () => root.querySelectorAll('[data-in="' + CSS.escape(cb.dataset.room) + '"]').forEach(x => x.checked = cb.checked)));
  root.querySelector('[data-x="copy"]').addEventListener('click', () => {
    const ids = [...root.querySelectorAll('input[data-in]:checked')].map(x => x.value);
    if (!ids.length) return toast('Select lights to copy to');
    if (!draft.power && !draft.level) return toast('This rule does nothing yet');
    edit(() => { s.rules[l.id] = {...draft}; ids.forEach(id => s.rules[id] = {...draft}); });
    toast('Copied to ' + ids.length + ' light' + (ids.length > 1 ? 's' : ''));
  });
  root.querySelectorAll('[data-go]').forEach(li => li.addEventListener('click', () => openEditor({type: 'cell', sid: li.dataset.go, lid: l.id})));
  root.querySelector('[data-x="close"]').addEventListener('click', closeEditor);
}
// Refreshes only the live-status line of an open cell editor after polling.
function refreshEditorLive() {
  if (!ui.ed || ui.ed.type !== 'cell') return;
  const l = lightById(ui.ed.lid), el = $('ed').querySelector('.row.note');
  if (l && el) el.innerHTML = 'Right now: ' + chip(l) + ' ' + esc(liveText(l));
}

function renderNewEditor(root, e) {
  const s = e.slot, l = e.lid ? lightById(e.lid) : null;
  let title = 'New empty timeslot', extra = '';
  if (e.kind === 'light') {
    title = 'New timeslot for ' + esc(l.name);
    extra = '<div class="row"><label class="f">Power<select data-n="power">' + opt(PW, e.rule.power) + '</select></label><label class="f">Level<select data-n="level">' + opt(LV, e.rule.level) + '</select></label>'
      + (e.rule.level ? '<label class="f">Percent<input type="number" min="1" max="100" data-n="value" value="' + e.rule.value + '"></label>' : '') + '</div>';
  } else if (e.kind === 'current') {
    title = 'New timeslot from current levels';
    let cl = '';
    rooms().forEach(([rn, ls]) => {
      cl += '<div class="g"><label><input type="checkbox" data-room="' + esc(rn) + '"' + (rn === 'Unassigned' ? '' : ' checked') + '> ' + esc(rn) + '</label><div>'
        + ls.map(x => '<label><input type="checkbox" value="' + x.id + '" data-in="' + esc(rn) + '"' + (rn === 'Unassigned' ? '' : ' checked') + '> ' + chip(x) + ' ' + esc(shortName(x)) + '</label>').join('') + '</div></div>';
    });
    extra = '<h3>Lights that are on now</h3><div class="row"><select data-c="onPower">' + opt([['on', 'Turn on'], ['', 'Leave as is']], e.cur.onPower) + '</select><select data-c="onLevel">' + opt([['set', 'Set to their current level'], ['atLeast', 'Raise to at least current level'], ['atMost', 'Dim to at most current level'], ['', 'No level change']], e.cur.onLevel) + '</select></div>'
      + '<h3>Lights that are off now</h3><div class="row"><select data-c="offPower">' + opt([['off', 'Turn off'], ['', 'Leave as is (skip)']], e.cur.offPower) + '</select></div>'
      + '<h3>Include</h3><div class="cl">' + cl + '</div>';
  }
  root.innerHTML = head(title)
    + '<div class="row"><label class="f" style="flex:1">Label<input type="text" data-n="label" maxlength="60" value="' + esc(s.label) + '"></label></div>'
    + timingHTML(s) + extra
    + '<div class="row"><button class="primary" data-x="create">Create</button><button data-x="close2">Cancel</button></div>';
  const redraw = fn => { fn(); redrawEditor(); };
  bindTiming(root, s, redraw);
  root.querySelector('[data-n="label"]').addEventListener('input', ev => s.label = ev.target.value.slice(0, 60));
  root.querySelectorAll('[data-n="power"],[data-n="level"],[data-n="value"]').forEach(el => el.addEventListener('change', () => redraw(() => {
    const f = el.dataset.n;
    if (f === 'value') e.rule.value = clampL(el.value); else e.rule[f] = el.value;
    if (e.rule.level && !e.rule.value) e.rule.value = defaultLevel(e.lid);
  })));
  root.querySelectorAll('[data-c]').forEach(el => el.addEventListener('change', () => e.cur[el.dataset.c] = el.value));
  root.querySelectorAll('[data-room]').forEach(cb => cb.addEventListener('change', () => root.querySelectorAll('[data-in="' + CSS.escape(cb.dataset.room) + '"]').forEach(x => x.checked = cb.checked)));
  root.querySelector('[data-x="close"]').addEventListener('click', closeEditor);
  root.querySelector('[data-x="close2"]').addEventListener('click', closeEditor);
  root.querySelector('[data-x="create"]').addEventListener('click', () => {
    s.label = s.label.trim();
    if (e.kind === 'light') {
      if (!e.rule.power && !e.rule.level) return toast('Choose a power or level change first');
      const rule = {power: e.rule.power, level: e.rule.level, value: e.rule.level ? e.rule.value : null};
      const ex = C().slots.find(o => o.timing === s.timing && T(o) === T(s));
      if (ex) { edit(() => ex.rules[l.id] = rule); toast('Added to “' + (ex.label || 'existing timeslot') + '”'); return openEditor({type: 'cell', sid: ex.id, lid: l.id}); }
      s.rules[l.id] = rule;
    } else if (e.kind === 'current') {
      [...root.querySelectorAll('input[data-in]:checked')].forEach(x => {
        const lt = lightById(x.value);
        if (lt.sw === 'on') {
          if (e.cur.onPower || e.cur.onLevel) s.rules[lt.id] = {power: e.cur.onPower, level: e.cur.onLevel, value: e.cur.onLevel ? clampL(lt.level || 1) : null};
        } else if (e.cur.offPower) s.rules[lt.id] = {power: 'off', level: '', value: null};
      });
    }
    if (!s.label) s.label = 'New timeslot';
    edit(() => C().slots.push(s));
    openEditor({type: 'slot', sid: s.id});
  });
}
function newSlot(kind, lid) {
  const n = nowMin(), m = kind === 'current' ? Math.round(n / 5) * 5 : Math.ceil((n + 1) / 60) * 60;
  const s = {id: uid(), label: kind === 'current' ? 'Snapshot' : '', timing: 'fixed', time: toHM(wrap(m)), offset: 0, rules: {}};
  openEditor({type: 'new', kind, lid, slot: s, rule: {power: '', level: 'set', value: lid ? defaultLevel(lid) : 50}, cur: {onPower: 'on', onLevel: 'set', offPower: 'off'}});
}

// ---------- interactions ----------
const tbl = $('m');
tbl.addEventListener('pointerdown', ev => {
  const th = ev.target.closest('th.sh'); if (!th || ev.button !== 0) return;
  const s = slotById(th.dataset.s);
  ui.drag = {id: s.id, x0: ev.clientX, m0: T(s), moved: false, key: 'drag:' + s.id + ':' + Date.now()};
  ev.preventDefault();
});
window.addEventListener('pointermove', ev => {
  const d = ui.drag; if (!d) return;
  const dx = ev.clientX - d.x0;
  if (!d.moved && Math.abs(dx) < 5) return;
  const s = slotById(d.id), m = d.m0 + Math.round(dx / 8) * 5;
  if (!d.moved) { d.moved = true; pushUndo(d.key); document.body.style.cursor = 'ew-resize'; }
  if (m !== T(s)) { setT(s, m); render(); setStatus('Moving to ' + fmt(T(s)) + '…'); }
});
window.addEventListener('pointerup', () => {
  const d = ui.drag; if (!d) return;
  ui.drag = null; document.body.style.cursor = '';
  if (d.moved) { scheduleSave(300); if (ui.ed && ui.ed.sid === d.id) renderEditor(); else openEditor({type: 'slot', sid: d.id}); }
  else openEditor({type: 'slot', sid: d.id});
});
tbl.addEventListener('keydown', ev => {
  const th = ev.target.closest('th.sh'); if (!th) return;
  const s = slotById(th.dataset.s);
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openEditor({type: 'slot', sid: s.id}); }
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    ev.preventDefault();
    const step = (ev.shiftKey ? 15 : 5) * (ev.key === 'ArrowLeft' ? -1 : 1);
    edit(() => setT(s, T(s) + step), {key: 'key:' + s.id});
    const again = tbl.querySelector('th.sh[data-s="' + s.id + '"]'); if (again) again.focus();
  }
});
tbl.addEventListener('click', ev => {
  const t = ev.target, a = t.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'menu') { ui.menu = true; return render(); }
    if (act === 'menuClose') { ui.menu = false; return render(); }
    if (act === 'newEmpty') return newSlot('empty');
    if (act === 'newCurrent') return newSlot('current');
    if (act === 'newLight') return newSlot('light', a.dataset.l);
  }
  const room = t.closest('tr.room');
  if (room) { const r = room.dataset.r; ui.closed.has(r) ? ui.closed.delete(r) : ui.closed.add(r); storeClosed(); return render(); }
  const td = t.closest('td.c');
  if (td) openEditor({type: 'cell', sid: td.dataset.s, lid: td.dataset.l});
});
$('strip').addEventListener('click', ev => { const d = ev.target.closest('.dot'); if (d) openEditor({type: 'slot', sid: d.dataset.s}); });
$('sched').addEventListener('click', ev => {
  const t = ev.target.closest('[data-sc]');
  if (t) return switchSched(t.dataset.sc);
  const x = ev.target.closest('[data-scx]');
  if (!x) return;
  if (x.dataset.scx === 'edit') openEditor({type: 'sched', scid: C().id});
  if (x.dataset.scx === 'new') {
    const used = new Set(TL.schedules.flatMap(sc => sc.days));
    openEditor({type: 'newsched', name: '', from: C().id, days: [1, 2, 3, 4, 5, 6, 7].filter(d => !used.has(d))});
  }
});
// Focusing a number field selects it, so typing replaces the value instead of adding to it.
let justSelected = null;
$('ed').addEventListener('focusin', ev => {
  const t = ev.target;
  if (t.tagName === 'INPUT' && t.type === 'number') { t.select(); justSelected = t; }
});
// A click that focuses the field would otherwise drop the selection on mouseup.
$('ed').addEventListener('mouseup', ev => { if (ev.target === justSelected) { ev.preventDefault(); justSelected = null; } });
$('ed').addEventListener('keydown', () => { justSelected = null; });
$('undoBtn').addEventListener('click', undo);
$('reloadBtn').addEventListener('click', async () => { if ((dirty || saving) && !conflict) await flush(); load(); });
document.addEventListener('keydown', ev => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !typing) { ev.preventDefault(); undo(); }
  if (ev.key === 'Escape' && ui.ed) closeEditor();
});
let toastT = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.className = 'on'; clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2600); }

// ---------- init ----------
$('bar').style.background = 'linear-gradient(90deg,' + [1, 10, 25, 45, 70, 100].map(col).join(',') + ')';
$('legendIcons').innerHTML = '<span class="mk" style="border-left:4px solid #639922"></span>turns on &nbsp; <span class="mk" style="border-left:4px solid #8a8882"></span>turns off &nbsp; '
  + '<span class="mk" style="background:' + col(30, .38) + '"></span>expected on &nbsp; <span class="mk" style="background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 3px,transparent 3px,transparent 6px)"></span>expected off &nbsp; '
  + '50 set to &nbsp; ≥ raise to at least &nbsp; ≤ dim to at most &nbsp; <span style="color:var(--acc)">now</span> = rules in effect';
if (MOCK) $('exportLink').style.display = 'none';
else $('exportLink').href = 'timeline?access_token=' + encodeURIComponent(TOKEN);
load();
setInterval(poll, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
